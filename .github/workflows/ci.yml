name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PHP_EXTENSIONS: mbstring, xml, curl, zip, intl, gd, mysqli, pdo_mysql, opcache

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-lint-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist

      - name: PHP syntax lint
        run: composer ci:php:lint

      - name: Coding guidelines (php-cs-fixer)
        run: composer ci:php:cgl

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-phpstan-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer ci:php:phpstan

  unit:
    name: "Unit (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        typo3: ['^13.4', '^14.3']
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-unit-${{ matrix.php }}-${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}

      - name: Bootstrap scaffold TYPO3 project
        run: Build/Scripts/ci-bootstrap.sh /tmp/ci-root "${{ matrix.typo3 }}"

      - name: Run unit tests
        run: vendor/bin/phpunit -c packages/lightroom_publish_service/Build/UnitTests.xml
        working-directory: /tmp/ci-root

  functional:
    name: "Functional (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        typo3: ['^13.4', '^14.3']

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-functional-${{ matrix.php }}-${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}

      - name: Bootstrap scaffold TYPO3 project
        run: Build/Scripts/ci-bootstrap.sh /tmp/ci-root "${{ matrix.typo3 }}"

      - name: Run functional tests
        working-directory: /tmp/ci-root
        env:
          typo3DatabaseDriver: mysqli
          typo3DatabaseHost: 127.0.0.1
          typo3DatabasePort: 3306
          typo3DatabaseName: typo3_test
          typo3DatabaseUsername: root
          typo3DatabasePassword: root
        run: vendor/bin/phpunit -c packages/lightroom_publish_service/Build/FunctionalTests.xml
