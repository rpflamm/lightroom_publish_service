<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module"/>
<f:section name="Content">
    <h1>Connection test</h1>

    <f:be.infobox
        state="{f:if(condition: storageOk, then: 0, else: 2)}"
        title="{f:if(condition: storageOk, then: 'Storage OK', else: 'Storage problem')}">
        <p>{storageMessage}</p>
    </f:be.infobox>

    <p>Active API tokens: <strong>{activeTokenCount}</strong></p>

    <p>
        Server URL to enter in the Lightroom plugin's Plugin Manager settings:<br/>
        <code>{apiBaseUrl}</code>
    </p>

</f:section>
</html>
