<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module"/>
<f:section name="Content">
    <h1>Create API token</h1>

    <f:form action="create" controller="Backend\Token" method="post">
        <div class="form-group">
            <label for="name">Name</label>
            <f:form.textfield name="name" id="name" class="form-control" placeholder="e.g. MacBook Pro - Lightroom" required="required"/>
        </div>
        <f:form.submit value="Create token" class="btn btn-primary" />
    </f:form>

</f:section>
</html>
